# Configuration Alembic (migrations de schéma de la couche Bronze).
# AUCUN identifiant ici : l'URL de connexion vient du .env (indusense.layers.database.EnvSettings).
# Commandes conseillées : uv run indusense db revision|upgrade|downgrade|current|check

[alembic]
script_location = %(here)s/migrations
# Scripts nommés par date : l'ordre de lecture suit l'ordre de création.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-7s | %(name)s | %(message)s
