[project]
name = "indusense"
version = "0.1.0"
description = "InduSense 4.0 — pipeline d'ingestion : cartes d'identité, audit qualité et contrats de données"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1",     # wheels CPython 3.15 disponibles à partir de 3.1
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0",     # lecture de la config et des contrats
    "sqlalchemy>=2.1.9",
    "sqlglot>=27",     # analyse des scripts SQL (pur Python)
]

[project.scripts]
# Après `uv sync`, la commande `uv run indusense ...` est disponible
indusense = "indusense.cli:main"

[dependency-groups]
dev = [
    "ipykernel",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indusense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
