# =============================================================================
# InduSense — configuration du pipeline d'ingestion
# Toute la logique est pilotée d'ici : pour une nouvelle source, on dépose le
# fichier dans data_dir (découverte automatique) et on ajoute son contrat dans
# configs/contracts/ — ni code ni nom de fichier à déclarer.
# Les chemins relatifs sont résolus depuis la racine du projet.
# =============================================================================
version: 1

paths:
  data_dir: datas
  contracts_dir: configs/contracts
  artifacts_dir: artifacts/ingestion
  # Sous-dossiers de artifacts_dir (horodatés AAAAMMJJ/<nom>_HHMMSS.*)
  identities: identities        # TP1 : cartes d'identité
  audits: audits                # audit qualité (guide data audit)
  validations: validations      # contrôle des données contre leur contrat
  drafts: contracts/drafts      # brouillons de contrats générés
  runs: runs                    # manifestes d'exécution (traçabilité)
  layers: layers                # bilans du chargement des couches (bronze, silver, gold)

# -----------------------------------------------------------------------------
# Découverte des sources : tout fichier de data_dir correspondant à un motif est
# traité. Identifiant = nom du fichier sans extension (telemetry.csv -> telemetry).
# Aucun nom de fichier ici : déposer un fichier dans data_dir suffit.
# -----------------------------------------------------------------------------
discovery:
  patterns: ["*.csv", "*.tsv", "*.sql", "*.sql.txt"]
  # Options de lecture imposées PAR MOTIF (glob sur le nom du fichier), dans l'ordre ;
  # la dernière règle qui correspond l'emporte. Options : format (csv | sql | auto),
  # encoding (auto | cp1252 | utf-8...), separator (auto | ";" ...), sql_dialect.
  # Par défaut tout est `auto` (format déduit de l'extension, encodage et séparateur détectés).
  overrides:
    - match: "*.sql*"
      format: sql
      sql_dialect: postgres     # TIMESTAMPTZ => scripts PostgreSQL

# -----------------------------------------------------------------------------
# Lecture et inférence de types (repris du notebook TP1)
# -----------------------------------------------------------------------------
reading:
  candidate_separators: [",", ";", "\t", "|"]
  sniff_bytes: 50000

# Cartographie : colonnes de même nom ignorées par la détection AUTOMATIQUE de relations
# (colonnes techniques présentes partout, qui ne relient pas les jeux de données)
relations:
  ignore_columns: [created_at, updated_at]

inference:
  na_tokens: ["", "na", "n/a", "nan", "null", "none", "-"]
  parse_rate_min: 0.95          # part de valeurs convertibles pour retenir un type
  category_max_unique: 30       # au-delà, un texte n'est plus une catégorie
  min_rows_for_identity: 20     # unicité significative seulement sur un échantillon suffisant
  identity_name_pattern: '(^id$|_id$|^id_|^code$|_code$|^matricule$)'
  time_pattern: '^\d{1,2}:\d{2}(:\d{2})?$'
  bool_values: ["0", "1", "true", "false", "oui", "non", "yes", "no", "t", "f"]

# -----------------------------------------------------------------------------
# Audit qualité (guide data audit — dimensions de qualité)
# Les règles de constats (textes, sévérités, SEUILS) sont dans un catalogue :
#   - par défaut : src/indusense/profiling/default_findings.yaml (faits seuls, générique) ;
#   - surchargé par la spécification métier du projet ci-dessous (facultative : si le
#     fichier n'existe pas, le catalogue par défaut s'applique).
# Une exception propre à une colonne se déclare dans son contrat (clé `audit:` + `reason`).
# -----------------------------------------------------------------------------
audit:
  findings_spec: configs/findings.yaml
  # Variables cibles candidates (distribution de classes)
  targets: []

# -----------------------------------------------------------------------------
# Couches de l'architecture médaillon dans PostgreSQL (commande `indusense load`)
# Les SECRETS (mot de passe, sel de pseudonymisation) sont dans .env, jamais ici.
# -----------------------------------------------------------------------------
layers:
  schemas: {bronze: bronze, silver: silver, gold: gold}
  chunk_size: 5000              # lignes envoyées par lot à PostgreSQL

  # BRONZE : une table par jeu de données ; on recopie, on ne corrige pas.
  #   Pour chaque colonne source `x` : x<raw_suffix> (valeur d'origine, texte) puis x (valeur
  #   convertie au mieux vers le type du contrat : NULL si vide ou non convertible).
  #   Puis les colonnes techniques. Clé primaire : (source_hash, row_number) -> rejouer un
  #   fichier déjà chargé n'insère rien (ON CONFLICT DO NOTHING).
  bronze:
    raw_suffix: _raw
    technical_columns:            # rôle -> nom de colonne
      batch_id: _batch_id         # lot d'ingestion (UUID)
      source_file: _source_file   # fichier d'origine (chemin relatif au projet)
      source_hash: _source_hash   # SHA-256 des octets du fichier
      row_number: _row_number     # numéro de l'enregistrement dans la source (1 = premier)
      ingested_at: _ingested_at   # horodatage du chargement (UTC)
      row_hash: _row_hash         # SHA-256 des valeurs d'origine de la ligne (doublons stricts)
      cast_errors: _cast_errors   # JSONB {colonne: motif} ; {} si tout est convertible
    registry_table: ingestion_batches_log   # une ligne par tentative de chargement
    # Structure des tables Bronze (et du registre) : gérée par des migrations Alembic, générées
    # depuis les contrats et les fichiers réels, relues, puis appliquées (`indusense db ...`).
    # Le chargement ne crée ni ne modifie aucune table.
    migrations:
      dir: migrations                 # env.py + versions/ (scripts revus et versionnés)
      version_table: alembic_version  # révision appliquée, rangée dans le schéma Bronze
    # Part maximale de lignes avec au moins une erreur de conversion. Au-delà, le lot est
    # annulé (rien n'est écrit) et l'échec est inscrit au registre. Un contrat peut fixer
    # sa propre valeur dans `source.max_cast_error_ratio` (décision tracée dans le contrat).
    max_cast_error_ratio: 0.0

  # SILVER : typé et contrôlé selon les contrats ; lignes invalides en quarantaine.
  silver:
    # Colonnes `pii: true` des contrats pseudonymisées (HMAC-SHA256 + sel) selon leur `privacy`.
    # Opération ANO : le Bronze garde la valeur d'origine, la protection se fait ici.
    # `drop` est inclus : la colonne est pseudonymisée avant d'être retirée, pour qu'elle
    # n'apparaisse jamais en clair dans la table de quarantaine.
    # `to_decide` n'est PAS inclus : la colonne reste en clair et un avertissement est affiché.
    pseudonymize_privacy: [pseudonymize, drop]
    rejects_suffix: _rejects      # silver.<jeu>_rejects : lignes en quarantaine
    reasons_column: reject_reasons

  # GOLD : une table par fichier <nom>.sql (une requête SELECT sur le Silver).
  gold:
    queries_dir: configs/gold
